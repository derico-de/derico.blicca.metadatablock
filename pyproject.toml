[project]
name = "derico.blicca.metadatablock"
version = "1.0.0a1"
description = "Aurora Metadata blocks: show the content item's own metadata fields (title, description, dates, tags, ...) as blocks, singly or as a section"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
authors = [
    {name = "Maik Derstappen", email = "md@derico.de"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: Addon",
    "Framework :: Plone :: 6.0",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["Plone", "CMS"]

dependencies = [
    "Plone>=6.0",
    # The blocks import plone.blicca.auroraeditor.rendering, which is versioned by
    # this distribution and NOT by the block-api number the registry records declare.
    "plone.blicca.auroraeditor>=1.0.0a2",
    "setuptools<81",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-plone>=0.5.0",
    "plone.app.testing",
    "plone.testing",
]

[project.urls]
Homepage = "https://github.com/derico-de/derico.blicca.metadatablock"
Documentation = "https://github.com/derico-de/derico.blicca.metadatablock"
Repository = "https://github.com/derico-de/derico.blicca.metadatablock.git"
Issues = "https://github.com/derico-de/derico.blicca.metadatablock/issues"

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derico"]

[tool.plone.backend_addon.settings]
package_name = "derico.blicca.metadatablock"
package_title = "Derico Blicca Metadatablock"
package_description = "Aurora Metadata blocks: show the content item's own metadata fields (title, description, dates, tags, ...) as blocks, singly or as a section"
package_folder = "derico/blicca/metadatablock"
plone_version = "6.0"
is_headless = false
author_name = "Maik Derstappen"
author_email = "md@derico.de"

[tool.plone.backend_addon.settings.subtemplates]
content_types = []
behaviors = []
services = ["@metadata-catalog"]
views = ["aurora-block-metadata", "aurora-block-metadataSection"]

[tool.uv]
# Resolve against the Plone the site actually runs, so the lock CI installs is
# the combination this add-on is developed against.
constraint-dependencies = ["Products.CMFPlone==6.2.1"]

[tool.uv.sources]
# plone.blicca.auroraeditor is PRIVATE and not on PyPI. Locally it is the
# sibling checkout under sources/; CI checks it out beside this repository so
# the same relative path resolves there. uv ignores a dependency's own
# sources, so this governs this package's lock and nothing else.
"plone.blicca.auroraeditor" = { path = "../plone.blicca.auroraeditor", editable = true }

[tool.pytest.ini_options]
testpaths = ["src/derico/blicca/metadatablock/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["derico.blicca.metadatablock"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "C90",  # mccabe complexity
    "B",    # bugbear
    "S",    # bandit (security)
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PGH",  # pygrep-hooks
]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: a test user's password is a fixture, not a secret.
"src/**/tests/**" = ["S101", "S105", "S106"]
# Locale update helper shells out to fixed translation tools (i18ndude/msginit).
"src/**/locales/update.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
# Match the single-import-per-line, alphabetical layout the templates emit.
force-single-line = true
order-by-type = false
lines-after-imports = 2
known-first-party = ["derico"]

[tool.ruff.format]
preview = true
